<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pain Tracker">
    <title>Pain Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="root"></div>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin
      src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const formatDisplayDate = (dateStr) => {
        if (!dateStr) return 'Unknown date';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1, d = parseInt(parts[2], 10);
          const date = new Date(y, m, d);
          if (!isNaN(date)) return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        return dateStr;
      };

      const toTimestamp = (dateStr) => {
        if (!dateStr) return 0;
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1, d = parseInt(parts[2], 10);
          const date = new Date(y, m, d);
          if (!isNaN(date)) return date.getTime();
        }
        return 0;
      };

      const todayKey = () => {
        const n = new Date();
        return `${n.getFullYear()}-${n.getMonth()}-${n.getDate()}`;
      };

      const dateToKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const dateToISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

      const storage = {
        get(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
      };

      const PAIN_LEVELS = [
        { level: 10, color: 'bg-purple-600', hex: '#6d28d9', title: 'Excruciating', desc: 'The pain is overwhelming, take me to the ER.' },
        { level: 9, color: 'bg-red-900', hex: '#7f1d1d', title: 'Debilitating', desc: "Can't think about anything else; any activity is too much." },
        { level: 8, color: 'bg-red-600', hex: '#dc2626', title: 'Relentless', desc: 'Unending & mentally overwhelming. Conversations & thinking is exhausting.' },
        { level: 7, color: 'bg-orange-500', hex: '#f97316', title: 'Exhausting', desc: 'The pain wears me down; always aware of it. Keeps me from doing a lot of what I need to do.' },
        { level: 6, color: 'bg-yellow-500', hex: '#eab308', title: 'Draining', desc: 'Mentally, physically and emotionally tiring; constantly thinking about it. Keeps me from doing some activities.' },
        { level: 5, color: 'bg-yellow-300', hex: '#fef08a', title: 'Aggravating', desc: 'Interferes with focus; harder to ignore; may affect my emotions.' },
        { level: 4, color: 'bg-lime-400', hex: '#a3e635', title: 'Bothersome', desc: 'Noticeable and irritating; occasionally distracting, but I can still handle most activity.' },
        { level: 3, color: 'bg-green-400', hex: '#34d399', title: 'Nagging', desc: 'Persistent, low grade pain, but I can ignore it with little effort.' },
        { level: 2, color: 'bg-green-500', hex: '#10b981', title: 'Minor', desc: 'Easy to ignore; has zero mental or physical impact.' },
        { level: 1, color: 'bg-green-600', hex: '#059669', title: 'Slight', desc: 'Barely noticeable; more of an awareness than a problem.' },
        { level: 0, color: 'bg-green-700', hex: '#047857', title: 'Pain Free', desc: '' },
      ];

      const DEFAULT_LOCATIONS = ['Forehead', 'Left Temple', 'Right Temple', 'Back of Head', 'Top of Head'];
      const DEFAULT_TRIGGERS = ['Daily Exertion', 'Exercise', 'Weather', 'Bright Light', 'Flickering Light', 'Loud Noise', 'Strong Smells', 'Screen Time', 'Alcohol', 'Certain Foods'];
      const DEFAULT_IMPACT = ['Had to rest or lie down', 'Cancelled or avoided activities', 'Missed work or obligations', 'Difficult to concentrate', 'Affected my mood', 'Withdrew from others', 'Needed help from others'];
      const DEFAULT_CONTRIBUTING = ['Dehydration', 'Skipped Meals', 'Neck Tension', 'Anxiety', 'Hormonal'];

      const emptyEntry = () => ({
        painLevels: [],
        locations: [],
        contributing: { sleep: null, stress: null, fatigue: null, caffeine: null, simple: [] },
        triggers: [], foodNote: '', weather: { pressure: '', trend: null, tempChange: false, wind: false, notes: '' },
        impact: { simple: [] },
        rescueMeds: '',
        notes: '',
        appointments: ''
      });

      // ── Chip button ──
      const Chip = ({ label, selected, onClick, color }) => (
        <button onClick={onClick}
          className={`px-3 py-2 text-sm rounded-lg border-2 ${selected ? (color || 'bg-blue-500 border-blue-600') + ' text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
          {label}
        </button>
      );

      // ── Scale selector (Good/Okay/Poor style) ──
      const ScaleSelector = ({ options, value, onChange, colors }) => (
        <div className="flex gap-2 flex-wrap">
          {options.map((o, i) => (
            <button key={o} onClick={() => onChange(value === o ? null : o)}
              className={`px-4 py-2 rounded-full font-medium text-sm ${value === o ? (colors[i] + ' text-white') : 'bg-gray-100 text-gray-700'}`}>
              {o}
            </button>
          ))}
        </div>
      );

      const PainTrackerApp = () => {
        const [currentDate, setCurrentDate] = useState(new Date());
        const [selectedDate, setSelectedDate] = useState(null);
        const [entries, setEntries] = useState({});
        const [currentEntry, setCurrentEntry] = useState(null);
        const [activeView, setActiveView] = useState('calendar');
        const [darkMode, setDarkMode] = useState(false);
        const [apptHistory, setApptHistory] = useState([]);
        const [showWeatherDetail, setShowWeatherDetail] = useState(false);
        const [storageWarning, setStorageWarning] = useState(false);
        // Daily medications state
        const [dailyMeds, setDailyMeds] = useState([]);
        const [medChangeHistory, setMedChangeHistory] = useState([]);
        const [newMedName, setNewMedName] = useState('');
        const [newMedDose, setNewMedDose] = useState('');
        const [editingMed, setEditingMed] = useState(null);
        const [medChangeNote, setMedChangeNote] = useState('');
        const [locations, setLocations] = useState(DEFAULT_LOCATIONS);
        const [removedLocations, setRemovedLocations] = useState([]);
        const [showLocationCustomize, setShowLocationCustomize] = useState(false);
        const [newLocationText, setNewLocationText] = useState('');
        const [triggers, setTriggers] = useState(DEFAULT_TRIGGERS);
        const [removedTriggers, setRemovedTriggers] = useState([]);
        const [showTriggerCustomize, setShowTriggerCustomize] = useState(false);
        const [newTriggerText, setNewTriggerText] = useState('');
        const [impactItems, setImpactItems] = useState(DEFAULT_IMPACT);
        const [removedImpact, setRemovedImpact] = useState([]);
        const [showImpactCustomize, setShowImpactCustomize] = useState(false);
        const [newImpactText, setNewImpactText] = useState('');
        const [contributingItems, setContributingItems] = useState(DEFAULT_CONTRIBUTING);
        const [removedContributing, setRemovedContributing] = useState([]);
        const [showContributingCustomize, setShowContributingCustomize] = useState(false);
        const [newContributingText, setNewContributingText] = useState('');

        useEffect(() => {
          const savedLocations = storage.get('customLocations'); if (savedLocations) setLocations(savedLocations);
          const savedRemoved = storage.get('removedLocations'); if (savedRemoved) setRemovedLocations(savedRemoved);
          const savedTriggers = storage.get('customTriggers'); if (savedTriggers) setTriggers(savedTriggers);
          const savedRemovedTriggers = storage.get('removedTriggers'); if (savedRemovedTriggers) setRemovedTriggers(savedRemovedTriggers);
          const savedImpact = storage.get('customImpact'); if (savedImpact) setImpactItems(savedImpact);
          const savedRemovedImpact = storage.get('removedImpact'); if (savedRemovedImpact) setRemovedImpact(savedRemovedImpact);
          const savedContributing = storage.get('customContributing'); if (savedContributing) setContributingItems(savedContributing);
          const savedRemovedContributing = storage.get('removedContributing'); if (savedRemovedContributing) setRemovedContributing(savedRemovedContributing);

          const testSave = storage.set('_test', 1);
          if (!testSave) setStorageWarning(true);
          else { try { localStorage.removeItem('_test'); } catch { } }

          const e = storage.get('entries'); if (e) setEntries(e);
          const d = storage.get('dark'); if (d != null) setDarkMode(d);
          const a = storage.get('apptHistory'); if (a) setApptHistory(a);
          const dm = storage.get('dailyMeds'); if (dm) setDailyMeds(dm);
          const mch = storage.get('medChangeHistory'); if (mch) setMedChangeHistory(mch);
        }, []);

        const saveLocations = (nextLocations, nextRemoved) => {
          setLocations(nextLocations);
          setRemovedLocations(nextRemoved);
          storage.set('customLocations', nextLocations);
          storage.set('removedLocations', nextRemoved);
        };

        const saveTriggers = (nextTriggers, nextRemoved) => {
          setTriggers(nextTriggers);
          setRemovedTriggers(nextRemoved);
          storage.set('customTriggers', nextTriggers);
          storage.set('removedTriggers', nextRemoved);
        };

        const saveImpact = (nextImpact, nextRemoved) => {
          setImpactItems(nextImpact);
          setRemovedImpact(nextRemoved);
          storage.set('customImpact', nextImpact);
          storage.set('removedImpact', nextRemoved);
        };

        const saveContributing = (nextContributing, nextRemoved) => {
          setContributingItems(nextContributing);
          setRemovedContributing(nextRemoved);
          storage.set('customContributing', nextContributing);
          storage.set('removedContributing', nextRemoved);
        };

        const removeLocation = (loc) => {
          if (!locations.includes(loc)) return;
          saveLocations(locations.filter(l => l !== loc), [...removedLocations, loc]);
          if (currentEntry?.locations?.includes(loc)) {
            setCurrentEntry({ ...currentEntry, locations: currentEntry.locations.filter(l => l !== loc) });
          }
        };

        const restoreLocation = (loc) => {
          if (!removedLocations.includes(loc)) return;
          saveLocations([...locations, loc], removedLocations.filter(l => l !== loc));
        };

        const addLocation = () => {
          const next = newLocationText.trim();
          if (!next || locations.includes(next)) return;
          saveLocations([...locations, next], removedLocations.filter(l => l !== next));
          setNewLocationText('');
        };

        const removeTrigger = (trg) => {
          if (!triggers.includes(trg)) return;
          saveTriggers(triggers.filter(t => t !== trg), [...removedTriggers, trg]);
          if (currentEntry?.triggers?.includes(trg)) {
            setCurrentEntry({ ...currentEntry, triggers: currentEntry.triggers.filter(t => t !== trg) });
          }
        };

        const restoreTrigger = (trg) => {
          if (!removedTriggers.includes(trg)) return;
          saveTriggers([...triggers, trg], removedTriggers.filter(t => t !== trg));
        };

        const addTrigger = () => {
          const next = newTriggerText.trim();
          if (!next || triggers.includes(next)) return;
          saveTriggers([...triggers, next], removedTriggers.filter(t => t !== next));
          setNewTriggerText('');
        };

        const removeImpactItem = (item) => {
          if (!impactItems.includes(item)) return;
          saveImpact(impactItems.filter(i => i !== item), [...removedImpact, item]);
          if (currentEntry?.impact?.simple?.includes(item)) {
            setCurrentEntry({ ...currentEntry, impact: { ...currentEntry.impact, simple: currentEntry.impact.simple.filter(i => i !== item) } });
          }
        };

        const restoreImpactItem = (item) => {
          if (!removedImpact.includes(item)) return;
          saveImpact([...impactItems, item], removedImpact.filter(i => i !== item));
        };

        const addImpactItem = () => {
          const next = newImpactText.trim();
          if (!next || impactItems.includes(next)) return;
          saveImpact([...impactItems, next], removedImpact.filter(i => i !== next));
          setNewImpactText('');
        };

        const removeContributingItem = (item) => {
          if (!contributingItems.includes(item)) return;
          saveContributing(contributingItems.filter(i => i !== item), [...removedContributing, item]);
          if (currentEntry?.contributing?.simple?.includes(item)) {
            setCurrentEntry({ ...currentEntry, contributing: { ...currentEntry.contributing, simple: currentEntry.contributing.simple.filter(i => i !== item) } });
          }
        };

        const restoreContributingItem = (item) => {
          if (!removedContributing.includes(item)) return;
          saveContributing([...contributingItems, item], removedContributing.filter(i => i !== item));
        };

        const addContributingItem = () => {
          const next = newContributingText.trim();
          if (!next || contributingItems.includes(next)) return;
          saveContributing([...contributingItems, next], removedContributing.filter(i => i !== next));
          setNewContributingText('');
        };

        useEffect(() => {
          if (selectedDate) {
            const key = dateToKey(selectedDate);
            const ex = entries[key];
            setCurrentEntry(ex ? {
              painLevels: ex.painLevels || [],
              locations: ex.locations || [],
              contributing: ex.contributing || { sleep: null, stress: null, fatigue: null, caffeine: null, simple: [] },
              triggers: ex.triggers || [],
              foodNote: ex.foodNote || '',
              weather: ex.weather || { pressure: '', trend: null, tempChange: false, wind: false, notes: '' },
              impact: ex.impact || { simple: [] },
              rescueMeds: ex.rescueMeds || '',
              notes: ex.notes || '',
              appointments: ex.appointments || ''
            } : emptyEntry());
          }
        }, [selectedDate]);

        const save = () => {
          if (!selectedDate || !currentEntry) return;
          const key = dateToKey(selectedDate);
          const isoDate = dateToISO(selectedDate);
          const oldEntry = entries[key];

          if (currentEntry.appointments && currentEntry.appointments !== oldEntry?.appointments) {
            const newAppt = [...apptHistory.filter(r => r.date !== isoDate), {
              date: isoDate, appointments: currentEntry.appointments,
              painLevels: currentEntry.painLevels, timestamp: Date.now()
            }];
            storage.set('apptHistory', newAppt);
            setApptHistory(newAppt);
          }

          const newEntries = { ...entries, [key]: currentEntry };
          storage.set('entries', newEntries);
          setEntries(newEntries);
          setSelectedDate(null);
          setShowWeatherDetail(false);
        };

        // Daily med functions
        const addDailyMed = () => {
          if (!newMedName.trim()) return;
          const med = { id: Date.now(), name: newMedName.trim(), dose: newMedDose.trim(), startDate: dateToISO(new Date()) };
          const updated = [...dailyMeds, med];
          storage.set('dailyMeds', updated);
          setDailyMeds(updated);
          const change = { date: dateToISO(new Date()), type: 'Added', med: med.name, dose: med.dose, note: medChangeNote, timestamp: Date.now() };
          const updatedHistory = [change, ...medChangeHistory];
          storage.set('medChangeHistory', updatedHistory);
          setMedChangeHistory(updatedHistory);
          setNewMedName(''); setNewMedDose(''); setMedChangeNote('');
        };

        const removeDailyMed = (med) => {
          const updated = dailyMeds.filter(m => m.id !== med.id);
          storage.set('dailyMeds', updated);
          setDailyMeds(updated);
          const change = { date: dateToISO(new Date()), type: 'Removed', med: med.name, dose: med.dose, note: medChangeNote, timestamp: Date.now() };
          const updatedHistory = [change, ...medChangeHistory];
          storage.set('medChangeHistory', updatedHistory);
          setMedChangeHistory(updatedHistory);
          setMedChangeNote('');
        };

        const saveMedEdit = () => {
          if (!editingMed) return;
          const old = dailyMeds.find(m => m.id === editingMed.id);
          const updated = dailyMeds.map(m => m.id === editingMed.id ? editingMed : m);
          storage.set('dailyMeds', updated);
          setDailyMeds(updated);
          const changes = [];
          if (old.dose !== editingMed.dose) changes.push(`dose changed from ${old.dose} to ${editingMed.dose}`);
          if (old.name !== editingMed.name) changes.push(`name changed from ${old.name} to ${editingMed.name}`);
          if (changes.length) {
            const change = { date: dateToISO(new Date()), type: 'Modified', med: editingMed.name, detail: changes.join('; '), note: medChangeNote, timestamp: Date.now() };
            const updatedHistory = [change, ...medChangeHistory];
            storage.set('medChangeHistory', updatedHistory);
            setMedChangeHistory(updatedHistory);
          }
          setEditingMed(null); setMedChangeNote('');
        };

        const exportJSON = () => {
          const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `pain-tracker-${new Date().toISOString().split('T')[0]}.json`;
          a.click(); URL.revokeObjectURL(url);
        };

        const exportCSV = () => {
          let csv = 'Date,Pain Levels,Locations,Sleep,Stress,Fatigue,Caffeine,Other Contributing,Triggers,Food Note,Barometric,Temp Change,Wind,Weather Notes,Impact,Rescue Meds,Notes,Appointments\n';
          Object.keys(entries).sort().forEach(key => {
            const e = entries[key];
            const [y, m, d] = key.split('-').map(Number);
            const date = new Date(y, m, d).toLocaleDateString();
            csv += `"${date}","${e.painLevels?.join(', ') || ''}","${e.locations?.join(', ') || ''}","${e.contributing?.sleep || ''}","${e.contributing?.stress || ''}","${e.contributing?.fatigue || ''}","${e.contributing?.caffeine || ''}","${e.contributing?.simple?.join(', ') || ''}","${e.triggers?.join(', ') || ''}","${(e.foodNote || '').replace(/"/g, '""')}","${e.weather?.pressure || ''} ${e.weather?.trend === 'up' ? '↑' : e.weather?.trend === 'down' ? '↓' : ''}","${e.weather?.tempChange ? 'Yes' : ''}","${e.weather?.wind ? 'Yes' : ''}","${(e.weather?.notes || '').replace(/"/g, '""')}","${e.impact?.simple?.join(', ') || ''}","${(e.rescueMeds || '').replace(/"/g, '""')}","${(e.notes || '').replace(/"/g, '""')}","${(e.appointments || '').replace(/"/g, '""')}"\n`;
          });
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `pain-tracker-${new Date().toISOString().split('T')[0]}.csv`;
          a.click(); URL.revokeObjectURL(url);
        };

        // Return an inline style object for calendar day background.
        // If multiple pain levels present, draw a diagonal split (top-right -> bottom-left)
        // Left (top-left triangle) shows highest pain, right (bottom-right triangle) shows lowest pain.
        const getDayBackgroundStyle = (date) => {
          const key = dateToKey(date);
          const entry = entries[key];
          if (!entry?.painLevels?.length) return null;
          const levels = entry.painLevels.slice().sort((a, b) => a - b);
          const low = levels[0];
          const high = levels[levels.length - 1];
          const lowHex = PAIN_LEVELS.find(p => p.level === low)?.hex || '#d1fae5';
          const highHex = PAIN_LEVELS.find(p => p.level === high)?.hex || '#7c3aed';
          if (low === high) {
            return { backgroundColor: highHex };
          }
          // diagonal from top-right to bottom-left -> use 135deg so left/top is highHex, right/bottom is lowHex
          return { background: `linear-gradient(135deg, ${highHex} 50%, ${lowHex} 50%)` };
        };

        const getDayTextClass = (date) => {
          const key = dateToKey(date);
          const entry = entries[key];
          if (!entry?.painLevels?.length) return darkMode ? 'text-green-100' : 'text-green-800';
          const levels = entry.painLevels.slice().sort((a, b) => a - b);
          const low = levels[0];
          const high = levels[levels.length - 1];
          const lowHex = PAIN_LEVELS.find(p => p.level === low)?.hex || '#d1fae5';
          const highHex = PAIN_LEVELS.find(p => p.level === high)?.hex || '#7c3aed';
          // compute average luminance to decide light/ dark text
          const hexToLuma = (h) => {
            const c = h.replace('#', '');
            const r = parseInt(c.substring(0, 2), 16) / 255;
            const g = parseInt(c.substring(2, 4), 16) / 255;
            const b = parseInt(c.substring(4, 6), 16) / 255;
            const srgb = [r, g, b].map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
            return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
          };
          if (low === high) return hexToLuma(highHex) < 0.5 ? 'text-white' : 'text-gray-800';
          const avg = (hexToLuma(lowHex) + hexToLuma(highHex)) / 2;
          return avg < 0.5 ? 'text-white' : 'text-gray-800';
        };

        const bg = darkMode ? 'bg-gray-900' : 'bg-gray-50';
        const card = darkMode ? 'bg-gray-800' : 'bg-white';
        const text = darkMode ? 'text-white' : 'text-gray-800';
        const muted = darkMode ? 'text-gray-400' : 'text-gray-600';
        const border = darkMode ? 'border-gray-700' : 'border-gray-200';
        const inputCls = `w-full p-3 border-2 ${border} ${card} ${text} rounded-lg`;
        const sectionTitle = `text-lg font-medium mb-3 ${text}`;

        // ── Weather detail screen ──
        if (selectedDate && currentEntry && showWeatherDetail) {
          const w = currentEntry.weather;
          const setW = (patch) => setCurrentEntry({ ...currentEntry, weather: { ...w, ...patch } });
          return (
            <div className={`max-w-2xl mx-auto ${bg} min-h-screen`}>
              <div className={`${card} p-4 flex justify-between items-center`}>
                <h2 className={`text-xl font-medium ${text}`}>Weather Details</h2>
                <button onClick={() => setShowWeatherDetail(false)} className="text-blue-600">Back</button>
              </div>
              <div className="p-4 space-y-6 pb-24">
                <div>
                  <h3 className={sectionTitle}>Barometric Pressure</h3>
                  <div className="flex gap-2 items-center">
                    <input type="text" value={w.pressure} onChange={(e) => setW({ pressure: e.target.value })} placeholder="30.12" className={`w-24 p-3 border-2 ${border} ${card} ${text} rounded-lg`} />
                    <button onClick={() => setW({ trend: w.trend === 'up' ? null : 'up' })} className={`p-3 rounded-lg border-2 ${w.trend === 'up' ? 'bg-blue-500 border-blue-600 text-white' : `${card} ${border} ${text}`}`}>↑</button>
                    <button onClick={() => setW({ trend: w.trend === 'down' ? null : 'down' })} className={`p-3 rounded-lg border-2 ${w.trend === 'down' ? 'bg-red-500 border-red-600 text-white' : `${card} ${border} ${text}`}`}>↓</button>
                  </div>
                </div>
                <div>
                  <h3 className={sectionTitle}>Other Weather Factors</h3>
                  <div className="flex gap-2 flex-wrap">
                    <button onClick={() => setW({ tempChange: !w.tempChange })} className={`px-4 py-2 rounded-lg border-2 ${w.tempChange ? 'bg-orange-500 text-white border-orange-600' : `${card} ${border} ${text}`}`}>Temperature Change</button>
                    <button onClick={() => setW({ wind: !w.wind })} className={`px-4 py-2 rounded-lg border-2 ${w.wind ? 'bg-orange-500 text-white border-orange-600' : `${card} ${border} ${text}`}`}>Wind / Chinook</button>
                  </div>
                </div>
                <div>
                  <h3 className={sectionTitle}>Weather Notes</h3>
                  <textarea value={w.notes} onChange={(e) => e.target.value.length <= 220 && setW({ notes: e.target.value })} className={inputCls} rows="3" placeholder="Describe today's weather..." />
                  <div className={`text-sm ${muted} text-right`}>{w.notes.length}/220</div>
                </div>
                <button onClick={() => setShowWeatherDetail(false)} className="w-full bg-blue-600 text-white py-4 rounded-lg font-medium">Done</button>
              </div>
            </div>
          );
        }

        // ── Daily entry screen ──
        if (selectedDate && currentEntry) {
          const ce = currentEntry;
          const setCE = (patch) => setCurrentEntry({ ...ce, ...patch });
          const setContrib = (patch) => setCE({ contributing: { ...ce.contributing, ...patch } });
          const toggleSimpleContrib = (item) => {
            const s = ce.contributing.simple;
            setContrib({ simple: s.includes(item) ? s.filter(x => x !== item) : [...s, item] });
          };
          const toggleTrigger = (t) => {
            const ts = ce.triggers;
            if (t === 'Weather') {
              setCE({ triggers: ts.includes(t) ? ts.filter(x => x !== t) : [...ts, t] });
              if (!ts.includes(t)) setShowWeatherDetail(true);
            } else {
              setCE({ triggers: ts.includes(t) ? ts.filter(x => x !== t) : [...ts, t] });
            }
          };
          const toggleImpact = (item) => {
            const s = ce.impact.simple;
            setCE({ impact: { ...ce.impact, simple: s.includes(item) ? s.filter(x => x !== item) : [...s, item] } });
          };

          return (
            <div className={`max-w-2xl mx-auto ${bg} min-h-screen`}>
              <div className={`${card} p-4 flex justify-between items-center sticky top-0 z-20 shadow-sm border-b ${darkMode ? 'border-gray-700 bg-gray-900/95' : 'border-gray-200 bg-white/95'} backdrop-blur-sm`}>
                <h2 className={`text-xl font-medium ${text}`}>{selectedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</h2>
                <button onClick={() => { setSelectedDate(null); setShowWeatherDetail(false); }} className="text-blue-600">Cancel</button>
              </div>
              <div className="p-4 space-y-6 pb-24">

                {/* Pain Level */}
                <div>
                  <h3 className={sectionTitle}>Pain Level</h3>
                  {PAIN_LEVELS.map(({ level, color, title, desc }) => (
                    <button key={level}
                      onClick={() => setCE({ painLevels: ce.painLevels.includes(level) ? ce.painLevels.filter(l => l !== level) : [...ce.painLevels, level] })}
                      className={`w-full text-left p-4 rounded-lg border-2 mb-2 ${ce.painLevels.includes(level) ? `${color} text-white` : `${card} ${border}`}`}>
                      <div className="flex gap-3">
                        <span className="text-3xl font-bold">{level}</span>
                        <div><div className="font-medium">{title}</div>{desc && <div className="text-sm opacity-90">{desc}</div>}</div>
                      </div>
                    </button>
                  ))}
                </div>

                {/* Pain Location */}
                <div>
                  <div className="flex items-center justify-between">
                    <h3 className={sectionTitle}>Pain Location</h3>
                    <button type="button" onClick={() => setShowLocationCustomize(!showLocationCustomize)} className="text-sm font-medium text-blue-600 hover:underline">
                      {showLocationCustomize ? 'Close' : 'Personalize'}
                    </button>
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {locations.map(l => (
                      <Chip key={l} label={l} selected={ce.locations.includes(l)}
                        onClick={() => setCE({ locations: ce.locations.includes(l) ? ce.locations.filter(x => x !== l) : [...ce.locations, l] })} />
                    ))}
                  </div>
                  <div className={`overflow-hidden transition-all duration-300 ${showLocationCustomize ? 'max-h-screen opacity-100 mt-4' : 'max-h-0 opacity-0'} `}>
                    <div className={`${showLocationCustomize ? 'pb-4' : 'pb-0'} space-y-4 max-h-96 overflow-y-auto`}>
                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <div className="flex flex-wrap gap-2">
                          {locations.map((loc) => (
                            <div key={loc} className={`flex items-center gap-2 rounded-full border px-3 py-2 ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'}`}>
                              <span className={`text-sm ${text}`}>{loc}</span>
                              <button type="button" onClick={() => removeLocation(loc)} className="text-sm text-red-500 hover:text-red-700">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>

                      {removedLocations.length > 0 && (
                        <div className={`rounded-xl border ${border} ${card} p-4`}>
                          <h4 className={`text-sm font-semibold mb-3 ${text}`}>Removed Presets</h4>
                          <div className="space-y-2">
                            {removedLocations.map((loc) => (
                              <button key={loc} type="button" onClick={() => restoreLocation(loc)} className="flex items-center gap-2 rounded-full border px-3 py-2 text-sm text-blue-600 hover:bg-blue-50">
                                <span className="text-lg">+</span>
                                <span>Restore "{loc}"</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <h4 className={`text-sm font-semibold mb-3 ${text}`}>Add Your Own</h4>
                        <div className="flex flex-col gap-2 sm:flex-row">
                          <input type="text" value={newLocationText} onChange={(e) => setNewLocationText(e.target.value)} placeholder="Enter location" className={inputCls} />
                          <button type="button" onClick={addLocation} className="rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:bg-blue-300" disabled={!newLocationText.trim()}>
                            Add
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Contributing Factors */}
                <div>
                  <div className="flex items-center justify-between">
                    <h3 className={sectionTitle}>Contributing Factors</h3>
                    <button type="button" onClick={() => setShowContributingCustomize(!showContributingCustomize)} className="text-sm font-medium text-blue-600 hover:underline">
                      {showContributingCustomize ? 'Close' : 'Personalize'}
                    </button>
                  </div>
                  <p className={`text-xs ${muted} mb-4`}>Not direct causes of pain, but which may increase the possibility of your experiencing pain.</p>
                  <div className="space-y-4">
                    <div>
                      <p className={`text-sm font-medium ${text} mb-2`}>Sleep Quality</p>
                      <ScaleSelector options={['Good', 'Okay', 'Poor']} value={ce.contributing.sleep}
                        onChange={(v) => setContrib({ sleep: v })}
                        colors={['bg-green-400', 'bg-yellow-400', 'bg-red-500']} />
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${text} mb-2`}>Stress Level</p>
                      <ScaleSelector options={['Mild', 'Significant', 'Severe']} value={ce.contributing.stress}
                        onChange={(v) => setContrib({ stress: v })}
                        colors={['bg-yellow-300', 'bg-orange-400', 'bg-red-500']} />
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${text} mb-2`}>Fatigue</p>
                      <ScaleSelector options={['Mild', 'Significant', 'Severe']} value={ce.contributing.fatigue}
                        onChange={(v) => setContrib({ fatigue: v })}
                        colors={['bg-yellow-300', 'bg-orange-400', 'bg-red-500']} />
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${text} mb-2`}>Caffeine</p>
                      <ScaleSelector options={['Too Much', 'Too Little', 'Withdrawal']} value={ce.contributing.caffeine}
                        onChange={(v) => setContrib({ caffeine: v })}
                        colors={['bg-orange-400', 'bg-orange-400', 'bg-red-500']} />
                    </div>
                    <div>
                      <p className={`text-sm font-medium ${text} mb-2`}>Other Factors</p>
                      <div className="flex gap-2 flex-wrap">
                        {contributingItems.map(item => (
                          <Chip key={item} label={item} selected={ce.contributing.simple.includes(item)}
                            onClick={() => toggleSimpleContrib(item)} />
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className={`overflow-hidden transition-all duration-300 ${showContributingCustomize ? 'max-h-screen opacity-100 mt-4' : 'max-h-0 opacity-0'} `}>
                    <div className={`${showContributingCustomize ? 'pb-4' : 'pb-0'} space-y-4 max-h-96 overflow-y-auto`}>
                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <div className="flex flex-wrap gap-2">
                          {contributingItems.map((item) => (
                            <div key={item} className={`flex items-center gap-2 rounded-full border px-3 py-2 ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'}`}>
                              <span className={`text-sm ${text}`}>{item}</span>
                              <button type="button" onClick={() => removeContributingItem(item)} className="text-sm text-red-500 hover:text-red-700">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>

                      {removedContributing.length > 0 && (
                        <div className={`rounded-xl border ${border} ${card} p-4`}>
                          <h4 className={`text-sm font-semibold mb-3 ${text}`}>Removed Presets</h4>
                          <div className="space-y-2">
                            {removedContributing.map((item) => (
                              <button key={item} type="button" onClick={() => restoreContributingItem(item)} className="flex items-center gap-2 rounded-full border px-3 py-2 text-sm text-blue-600 hover:bg-blue-50">
                                <span className="text-lg">+</span>
                                <span>Restore "{item}"</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <h4 className={`text-sm font-semibold mb-3 ${text}`}>Add Your Own</h4>
                        <div className="flex flex-col gap-2 sm:flex-row">
                          <input type="text" value={newContributingText} onChange={(e) => setNewContributingText(e.target.value)} placeholder="Enter factor" className={inputCls} />
                          <button type="button" onClick={addContributingItem} className="rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:bg-blue-300" disabled={!newContributingText.trim()}>
                            Add
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Triggers */}
                <div>
                  <div className="flex items-center justify-between">
                    <h3 className={sectionTitle}>Triggers</h3>
                    <button type="button" onClick={() => setShowTriggerCustomize(!showTriggerCustomize)} className="text-sm font-medium text-blue-600 hover:underline">
                      {showTriggerCustomize ? 'Close' : 'Personalize'}
                    </button>
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {triggers.map(t => (
                      <Chip key={t} label={t} selected={ce.triggers.includes(t)}
                        onClick={() => toggleTrigger(t)}
                        color="bg-orange-500 border-orange-600" />
                    ))}
                  </div>
                  <div className={`overflow-hidden transition-all duration-300 ${showTriggerCustomize ? 'max-h-screen opacity-100 mt-4' : 'max-h-0 opacity-0'} `}>
                    <div className={`${showTriggerCustomize ? 'pb-4' : 'pb-0'} space-y-4 max-h-96 overflow-y-auto`}>
                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <div className="flex flex-wrap gap-2">
                          {triggers.map((trg) => (
                            <div key={trg} className={`flex items-center gap-2 rounded-full border px-3 py-2 ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'}`}>
                              <span className={`text-sm ${text}`}>{trg}</span>
                              <button type="button" onClick={() => removeTrigger(trg)} className="text-sm text-red-500 hover:text-red-700">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>

                      {removedTriggers.length > 0 && (
                        <div className={`rounded-xl border ${border} ${card} p-4`}>
                          <h4 className={`text-sm font-semibold mb-3 ${text}`}>Removed Presets</h4>
                          <div className="space-y-2">
                            {removedTriggers.map((trg) => (
                              <button key={trg} type="button" onClick={() => restoreTrigger(trg)} className="flex items-center gap-2 rounded-full border px-3 py-2 text-sm text-blue-600 hover:bg-blue-50">
                                <span className="text-lg">+</span>
                                <span>Restore "{trg}"</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <h4 className={`text-sm font-semibold mb-3 ${text}`}>Add Your Own</h4>
                        <div className="flex flex-col gap-2 sm:flex-row">
                          <input type="text" value={newTriggerText} onChange={(e) => setNewTriggerText(e.target.value)} placeholder="Enter trigger" className={inputCls} />
                          <button type="button" onClick={addTrigger} className="rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:bg-blue-300" disabled={!newTriggerText.trim()}>
                            Add
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  {ce.triggers.includes('Weather') && (
                    <div className={`mt-3 p-3 ${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-lg border ${border}`}>
                      <div className={`text-sm font-medium ${text} mb-1`}>Weather Details:</div>
                      {ce.weather.pressure && <div className={`text-sm ${text}`}>Pressure: {ce.weather.pressure} {ce.weather.trend === 'up' ? '↑' : ce.weather.trend === 'down' ? '↓' : ''}</div>}
                      {ce.weather.tempChange && <div className={`text-sm ${text}`}>• Temperature Change</div>}
                      {ce.weather.wind && <div className={`text-sm ${text}`}>• Wind / Chinook</div>}
                      {ce.weather.notes && <div className={`text-sm ${text}`}>{ce.weather.notes}</div>}
                      {!ce.weather.pressure && !ce.weather.tempChange && !ce.weather.wind && !ce.weather.notes && (
                        <div className={`text-sm ${muted} italic`}>Tap Weather again to add details</div>
                      )}
                      <button onClick={() => setShowWeatherDetail(true)} className="mt-2 text-blue-600 text-sm">Edit weather details →</button>
                    </div>
                  )}
                  {ce.triggers.includes('Certain Foods') && (
                    <div className="mt-3">
                      <input type="text" value={ce.foodNote}
                        onChange={(e) => e.target.value.length <= 100 && setCE({ foodNote: e.target.value })}
                        placeholder="What did you eat? (e.g. aged cheese, red wine)"
                        className={inputCls} />
                      <div className={`text-sm ${muted} text-right`}>{ce.foodNote.length}/100</div>
                    </div>
                  )}
                </div>

                {/* Impact */}
                <div>
                  <div className="flex items-center justify-between">
                    <h3 className={sectionTitle}>Impact</h3>
                    <button type="button" onClick={() => setShowImpactCustomize(!showImpactCustomize)} className="text-sm font-medium text-blue-600 hover:underline">
                      {showImpactCustomize ? 'Close' : 'Personalize'}
                    </button>
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {impactItems.map(item => (
                      <Chip key={item} label={item} selected={ce.impact.simple.includes(item)}
                        onClick={() => toggleImpact(item)}
                        color="bg-purple-500 border-purple-600" />
                    ))}
                  </div>
                  <div className={`overflow-hidden transition-all duration-300 ${showImpactCustomize ? 'max-h-screen opacity-100 mt-4' : 'max-h-0 opacity-0'} `}>
                    <div className={`${showImpactCustomize ? 'pb-4' : 'pb-0'} space-y-4 max-h-96 overflow-y-auto`}>
                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <div className="flex flex-wrap gap-2">
                          {impactItems.map((item) => (
                            <div key={item} className={`flex items-center gap-2 rounded-full border px-3 py-2 ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'}`}>
                              <span className={`text-sm ${text}`}>{item}</span>
                              <button type="button" onClick={() => removeImpactItem(item)} className="text-sm text-red-500 hover:text-red-700">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>

                      {removedImpact.length > 0 && (
                        <div className={`rounded-xl border ${border} ${card} p-4`}>
                          <h4 className={`text-sm font-semibold mb-3 ${text}`}>Removed Presets</h4>
                          <div className="space-y-2">
                            {removedImpact.map((item) => (
                              <button key={item} type="button" onClick={() => restoreImpactItem(item)} className="flex items-center gap-2 rounded-full border px-3 py-2 text-sm text-blue-600 hover:bg-blue-50">
                                <span className="text-lg">+</span>
                                <span>Restore "{item}"</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className={`rounded-xl border ${border} ${card} p-4`}>
                        <h4 className={`text-sm font-semibold mb-3 ${text}`}>Add Your Own</h4>
                        <div className="flex flex-col gap-2 sm:flex-row">
                          <input type="text" value={newImpactText} onChange={(e) => setNewImpactText(e.target.value)} placeholder="Enter impact" className={inputCls} />
                          <button type="button" onClick={addImpactItem} className="rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 disabled:bg-blue-300" disabled={!newImpactText.trim()}>
                            Add
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Rescue Medications */}
                <div>
                  <h3 className={sectionTitle}>Medications Taken Today</h3>
                  <textarea value={ce.rescueMeds} onChange={(e) => e.target.value.length <= 240 && setCE({ rescueMeds: e.target.value })} className={inputCls} rows="3" placeholder="Medications taken in response to pain today..." />
                  <div className={`text-sm ${muted} text-right`}>{ce.rescueMeds.length}/240</div>
                </div>

                {/* Notes */}
                <div>
                  <h3 className={sectionTitle}>Notes</h3>
                  <textarea value={ce.notes} onChange={(e) => e.target.value.length <= 440 && setCE({ notes: e.target.value })} className={inputCls} rows="4" placeholder="Notes..." />
                  <div className={`text-sm ${muted} text-right`}>{ce.notes.length}/440</div>
                </div>

                {/* Appointments */}
                <div>
                  <h3 className={sectionTitle}>Medical Appointments</h3>
                  <textarea value={ce.appointments} onChange={(e) => e.target.value.length <= 440 && setCE({ appointments: e.target.value })} className={inputCls} rows="4" placeholder="Appointments, procedures, tests..." />
                  <div className={`text-sm ${muted} text-right`}>{ce.appointments.length}/440</div>
                </div>

                <button onClick={save} className="w-full bg-blue-600 text-white py-4 rounded-lg font-medium">Save Entry</button>
              </div>
            </div>
          );
        }

        // ── Calendar / Stats / History / Medications views ──
        const { daysInMonth, startingDayOfWeek } = (() => {
          const y = currentDate.getFullYear(), m = currentDate.getMonth();
          return { daysInMonth: new Date(y, m + 1, 0).getDate(), startingDayOfWeek: new Date(y, m, 1).getDay() };
        })();

        return (
          <div className={`max-w-2xl mx-auto ${bg} min-h-screen`}>
            <div className={`${card} p-4 flex justify-between items-center`}>
              <h1 className={`text-2xl font-medium ${text}`}>Pain Tracker</h1>
              <button onClick={() => { const n = !darkMode; setDarkMode(n); storage.set('dark', n); }} className="text-2xl">{darkMode ? '☀️' : '🌙'}</button>
            </div>

            {storageWarning && (
              <div className="bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-2 text-sm text-center">
                ⚠️ Storage unavailable — data will not be saved. Try a different browser or disable private mode.
              </div>
            )}

            {/* Calendar */}
            {activeView === 'calendar' && (
              <div className={`${card} p-4`}>
                <div className="flex justify-between items-center mb-6">
                  <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))} className="p-2 text-2xl">←</button>
                  <div className="flex flex-col items-center">
                    <h2 className={`text-2xl font-medium ${text}`}>{currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                    <div className="flex items-center gap-2 mt-2">
                      <div
                        style={{ width: 28, height: 28, background: 'linear-gradient(135deg,#dc2626 50%,#10b981 50%)' }}
                        className="rounded-sm border"
                        aria-hidden="true"
                      />
                      <div className="text-sm">
                        <div className={`font-medium ${text}`}>Legend</div>
                        <div className={`text-xs ${muted}`}>Left/top = highest • Right/bottom = lowest</div>
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))} className="p-2 text-2xl">→</button>
                </div>
                <div className="grid grid-cols-7 gap-2 mb-2">
                  {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => <div key={d} className={`text-center text-sm ${muted}`}>{d}</div>)}
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {Array(startingDayOfWeek).fill(0).map((_, i) => <div key={i} />)}
                  {Array(daysInMonth).fill(0).map((_, i) => {
                    const d = new Date(currentDate.getFullYear(), currentDate.getMonth(), i + 1);
                    const dayStyle = getDayBackgroundStyle(d);
                    const dayText = getDayTextClass(d);
                    const defaultBgClass = darkMode ? 'bg-green-900' : 'bg-green-100';
                    return <button key={i} onClick={() => setSelectedDate(d)} className={`aspect-square rounded-lg font-medium text-lg ${dayText} ${dayStyle ? '' : defaultBgClass}`} style={dayStyle}>{i + 1}</button>;
                  })}
                </div>
                <button onClick={() => setSelectedDate(new Date())} className="fixed bottom-20 right-4 bg-blue-600 text-white px-5 py-4 rounded-full shadow-lg z-10 font-semibold text-sm">Today</button>
              </div>
            )}

            {/* Stats */}
            {activeView === 'stats' && (
              <div className={`${card} p-4 pb-24`}>
                <h2 className={`text-2xl font-medium mb-6 ${text}`}>Statistics</h2>
                {Object.keys(entries).length === 0 ? <p className={`${muted} text-center py-12`}>No entries yet</p> : (() => {
                  const counts = {}; let total = 0;
                  Object.values(entries).forEach(e => { if (e.painLevels?.length) { total++; e.painLevels.forEach(l => counts[l] = (counts[l] || 0) + 1); } });
                  const avg = total ? Object.entries(counts).reduce((s, [l, c]) => s + l * c, 0) / Object.values(counts).reduce((s, c) => s + c, 0) : 0;
                  return (
                    <div>
                      <div className={`${darkMode ? 'bg-blue-900' : 'bg-blue-50'} rounded-lg p-4 mb-6`}>
                        <div className="grid grid-cols-2 gap-4">
                          <div><p className={`text-sm ${muted}`}>Entries</p><p className={`text-2xl font-bold ${darkMode ? 'text-blue-100' : 'text-blue-600'}`}>{Object.keys(entries).length}</p></div>
                          <div><p className={`text-sm ${muted}`}>Pain Days</p><p className={`text-2xl font-bold ${darkMode ? 'text-blue-100' : 'text-blue-600'}`}>{total}</p></div>
                          <div className="col-span-2"><p className={`text-sm ${muted}`}>Avg Pain</p><p className={`text-2xl font-bold ${darkMode ? 'text-blue-100' : 'text-blue-600'}`}>{avg.toFixed(1)}</p></div>
                        </div>
                      </div>
                      {PAIN_LEVELS.map(({ level, color, title }) => {
                        const c = counts[level] || 0, p = total ? (c / total) * 100 : 0;
                        return (
                          <div key={level} className="flex items-center gap-3 mb-2">
                            <div className={`w-8 h-8 rounded ${color} flex items-center justify-center text-white font-bold text-sm`}>{level}</div>
                            <div className="flex-1">
                              <div className={`flex justify-between text-sm ${text}`}><span>{title}</span><span className={muted}>{c} days</span></div>
                              <div className={`h-2 ${darkMode ? 'bg-gray-700' : 'bg-gray-200'} rounded-full`}><div className={color} style={{ width: `${p}%`, height: '100%' }} /></div>
                            </div>
                          </div>
                        );
                      })}
                      <div className="space-y-2 mt-6">
                        <button onClick={exportJSON} className={`w-full ${darkMode ? 'bg-gray-700' : 'bg-gray-800'} text-white py-3 rounded-lg font-medium`}>📋 Export as JSON</button>
                        <button onClick={exportCSV} className={`w-full ${darkMode ? 'bg-gray-700' : 'bg-gray-800'} text-white py-3 rounded-lg font-medium`}>📊 Export as CSV</button>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* Medical History */}
            {activeView === 'medHistory' && (
              <div className={`${card} p-4 pb-24 overflow-y-auto`}>
                <h2 className={`text-2xl font-medium mb-6 ${text}`}>Medical History</h2>
                {apptHistory.length > 0 ? (
                  <div className="space-y-4">
                    {apptHistory.slice().sort((a, b) => toTimestamp(b.date) - toTimestamp(a.date)).map((record, idx) => (
                      <div key={idx} className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-lg p-4 border ${border}`}>
                        <div className="flex justify-between items-start mb-2">
                          <span className={`font-medium ${text}`}>{formatDisplayDate(record.date)}</span>
                          {record.painLevels?.length > 0 && <span className={`text-sm ${muted}`}>Pain: {record.painLevels.join(', ')}</span>}
                        </div>
                        <p className={`${text} text-sm`}>{record.appointments}</p>
                      </div>
                    ))}
                  </div>
                ) : <p className={`${muted} text-center py-12`}>No appointments recorded yet</p>}
              </div>
            )}

            {/* Daily Medications */}
            {activeView === 'dailyMeds' && (
              <div className={`${card} p-4 pb-24 overflow-y-auto`}>
                <h2 className={`text-2xl font-medium mb-6 ${text}`}>Daily Medications</h2>

                {/* Current medications */}
                <div className="mb-6">
                  <h3 className={`text-lg font-medium mb-3 ${text}`}>Current Medications</h3>
                  {dailyMeds.length === 0 ? (
                    <p className={`${muted} text-sm mb-4`}>No daily medications added yet.</p>
                  ) : (
                    <div className="space-y-3 mb-4">
                      {dailyMeds.map(med => (
                        <div key={med.id} className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-lg p-3 border ${border}`}>
                          {editingMed?.id === med.id ? (
                            <div className="space-y-2">
                              <input value={editingMed.name} onChange={(e) => setEditingMed({ ...editingMed, name: e.target.value })} className={inputCls} placeholder="Medication name" />
                              <input value={editingMed.dose} onChange={(e) => setEditingMed({ ...editingMed, dose: e.target.value })} className={inputCls} placeholder="Dose (e.g. 150mg)" />
                              <input value={medChangeNote} onChange={(e) => setMedChangeNote(e.target.value)} className={inputCls} placeholder="Note about this change (optional)" />
                              <div className="flex gap-2">
                                <button onClick={saveMedEdit} className="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm">Save</button>
                                <button onClick={() => { setEditingMed(null); setMedChangeNote(''); }} className="flex-1 bg-gray-400 text-white py-2 rounded-lg text-sm">Cancel</button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex justify-between items-center">
                              <div>
                                <div className={`font-medium ${text}`}>{med.name}</div>
                                {med.dose && <div className={`text-sm ${muted}`}>{med.dose}</div>}
                                <div className={`text-xs ${muted}`}>Since {formatDisplayDate(med.startDate)}</div>
                              </div>
                              <div className="flex gap-2">
                                <button onClick={() => { setEditingMed({ ...med }); setMedChangeNote(''); }} className="text-blue-600 text-sm px-2">Edit</button>
                                <button onClick={() => removeDailyMed(med)} className="text-red-500 text-sm px-2">Remove</button>
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Add new medication */}
                  <div className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-lg p-3 border ${border} space-y-2`}>
                    <p className={`text-sm font-medium ${text}`}>Add Medication</p>
                    <input value={newMedName} onChange={(e) => setNewMedName(e.target.value)} className={inputCls} placeholder="Medication name" />
                    <input value={newMedDose} onChange={(e) => setNewMedDose(e.target.value)} className={inputCls} placeholder="Dose (e.g. 150mg twice daily)" />
                    <input value={medChangeNote} onChange={(e) => setMedChangeNote(e.target.value)} className={inputCls} placeholder="Note (optional)" />
                    <button onClick={addDailyMed} className="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium">+ Add Medication</button>
                  </div>
                </div>

                {/* Medication change history */}
                <div>
                  <h3 className={`text-lg font-medium mb-3 ${text}`}>Change History</h3>
                  {medChangeHistory.length === 0 ? (
                    <p className={`${muted} text-sm`}>No changes recorded yet.</p>
                  ) : (
                    <div className="space-y-3">
                      {medChangeHistory.map((change, idx) => (
                        <div key={idx} className={`${darkMode ? 'bg-gray-700' : 'bg-gray-50'} rounded-lg p-3 border ${border}`}>
                          <div className="flex justify-between items-start mb-1">
                            <span className={`font-medium ${text} text-sm`}>{formatDisplayDate(change.date)}</span>
                            <span className={`text-xs px-2 py-1 rounded-full ${change.type === 'Added' ? 'bg-green-100 text-green-800' : change.type === 'Removed' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}`}>{change.type}</span>
                          </div>
                          <p className={`text-sm ${text}`}>{change.med} {change.dose ? `— ${change.dose}` : ''}</p>
                          {change.detail && <p className={`text-xs ${muted}`}>{change.detail}</p>}
                          {change.note && <p className={`text-xs ${muted} italic`}>{change.note}</p>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Bottom nav */}
            <div className={`fixed bottom-0 left-0 right-0 max-w-2xl mx-auto ${card} border-t ${border} flex`}>
              <button onClick={() => setActiveView('calendar')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeView === 'calendar' ? 'text-blue-600' : muted}`}>
                <span className="text-xl">📅</span><span className="text-xs">Calendar</span>
              </button>
              <button onClick={() => setActiveView('stats')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeView === 'stats' ? 'text-blue-600' : muted}`}>
                <span className="text-xl">📊</span><span className="text-xs">Stats</span>
              </button>
              <button onClick={() => setActiveView('medHistory')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeView === 'medHistory' ? 'text-blue-600' : muted}`}>
                <span className="text-xl">🏥</span><span className="text-xs">History</span>
              </button>
              <button onClick={() => setActiveView('dailyMeds')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeView === 'dailyMeds' ? 'text-blue-600' : muted}`}>
                <span className="text-xl">💊</span><span className="text-xs">Medications</span>
              </button>
            </div>
          </div>
        );
      };

      ReactDOM.render(<PainTrackerApp />, document.getElementById('root'));
    </script>
  </body>

</html>
